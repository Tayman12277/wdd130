<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell M. Nelson</title>
    <style>
        .prophet-card {
            background-color: #008DB1;
            border: 1px solid #004e63;
            border-radius: 20px;
            width: 300px;
            margin: 2em auto;
            color: #fffffe;
            text-align: center;
            padding: 1em;
        }
        .prophet-card ul{
            max-width: 80%;


        }
        .prophet-card img{
            max-width: 80%;
            height: auto;

        }

        .prophet-card blockquote{
            text-align: center;
            font-style: italic;
        }
        
        body {
            background: #FFECD7;
            
        }
        h1 h2{
            text-align: center;
        }
    </style>
</head>
<body>
        <div class="prophet-card"> 
            <h1>Russell M. Nelson</h1>
            <h2>17th President of the Church of Jesus Christ of Latter-day Saints</h2>
            <a href="https://www.churchofjesuschrist.org/?lang=eng">
                <img src="images/russell_nelson.png" alt="pres nelson">
            </a>
            <ul>
                <li>Born: Sept 9, 1924</li>
                <li>Apostle: Apr 7, 1984</li>
                <li>Prophet: Jan 14, 2018</li>
            </ul>
            <blockquote>
                "I urge you to devote time each week &mdash; for the rest of your life &mdash; to increase your understanding of the Atonement of Jesus Christ"
            </blockquote>
        </div>
    
</body>
</html>
