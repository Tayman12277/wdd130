<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Breaker 2</title>
    
    <style>

        *{
            box-sizing: border-box;
        }
        #box {
            max-width: 1400px;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1em;
            align-items: end;
        }

        h2{
            text-align: center;
            color: white;
            font-weight: normal;
        }


        #box h1{
            flex: 1 1 100%;
            color: white;
            font-weight: normal;
        }
            #box img{
                border-radius: 50%;
                width: 250px;
                height: 250px;
                object-fit: cover;
                object-position: 50% 0;
                border: 15px solid white;

            }
        img{
            border: 12px solid white;
            border-radius: 50%;
            width: 175px;
            height: 175px;
            object-fit: cover;
            object-position: 50% 0%;
        }
        img#middle-image{
            width: 300px;
            height: 300px;

        }
        #apostles-box{
            background-image: url(images/christus.webp);
            background-size: cover;
            background-repeat: no-repeat;
            border: 15px solid black;
            border-radius: 30px;
            width: 90%;
            height: auto;
            margin: 30px auto;
            background-position: 75% center;
        }

        first-presidency-box{
             margin: center auto;
             width: 60%;
             height: auto;
             display: flex;
        }
        body{
            background-color: #E8ECED;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: normal;

        }
        img.large-image{
            width: 175px;
            height: 175px;
        }
        #first-presidency-box img{
            margin: .8em;
        }
        #quorum-twelve-box {
            max-width: 70%;
            display: grid;
            grid-template-columns: auto auto auto auto;
            margin: 0% auto;
            justify-items: center;
            row-gap: 1em;
        }

    </style>
</head>
<body>

    <div id="apostles-box">
        <div id="first-presidency-box">
             <div id="box">
        <h1>First Presidency</h1>
        <img src="images/eyring.webp" alt="placehold">
        <img src="images/nelson.webp" alt="placehold" id="middle-image">
        <img src="images/oaks.webp" alt="placehold">
    </div>
            <h2>Quorum of the Twelve Apostles</h2>
            <div id="quorum-twelve-box">
            <img src="images/holland.webp" alt="placehold">
            <img src="images/uchtdorf.webp" alt="placehold">
            <img src="images/uchtdorf.webp" alt="placehold">
            <img src="images/anderson.webp" alt="placehold">
            <img src="images/cook.webp" alt="placehold">
            <img src="images/rasband.webp" alt="placehold">
            <img src="images/renlund.webp" alt="placehold">
            <img src="images/stevenson.webp" alt="placehold">
            <img src="images/christofferson.webp" alt="placehold">
            <img src="images/gong.webp" alt="placehold">
            <img src="images/soares.webp" alt="placehold">
            <img src="images/kearon.webp" alt="placehold">
            

        </div>
    </div>
</body>
</html>
